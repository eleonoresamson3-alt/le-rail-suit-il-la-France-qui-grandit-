# Paramètres communs du projet. Une valeur non vérifiée est notée A_VERIFIER.

# période de comparaison (recensement 2023)
annee_debut: 2017
annee_fin: 2023

# millésime des contours des communes (cartiflette)
annee_geographie: 2026

# projection pour les calculs de distance (Lambert 93, en mètres)
crs_calcul: 2154
dossiers:
  brut: data/raw
  propre: data/clean

# classes de taille des communes (habitants en 2023)
bornes_taille: [0, 500, 2000, 5000, 10000, 50000]
noms_taille: ["moins de 500", "500 à 2 000", "2 000 à 5 000", "5 000 à 10 000", "10 000 à 50 000", "50 000 et plus"]
# adresses des données
urls:
  # SDES, parc de véhicules routiers au niveau communal (API DiDo)
  parc_auto: https://data.statistiques.developpement-durable.gouv.fr/dido/api/v1/datafiles/1582861b-e042-4490-9161-6429d8229703/csv
  # INSEE, séries historiques du recensement 2023
  population: https://www.insee.fr/fr/statistiques/fichier/9003931/DS_RP_SERIE_HISTORIQUE_2023.parquet
  # INSEE, déplacements domicile-travail 2023 et table de passage des codes
  navettes: https://www.insee.fr/fr/statistiques/fichier/8992172/DS_RP_NAVETTES_PRINC_2023.parquet
  table_passage_navettes: https://www.insee.fr/fr/statistiques/fichier/8992172/Table_passage_rp_activite_navettes.xlsx
  # bonus : DGAC, trafic aérien par paire d'aéroports (série PAP)
  dgac_pap: https://static.data.gouv.fr/resources/trafic-aerien-commercial-mensuel-francais-par-paire-daeroports-par-sens-depuis-1990/20260903-120658/asp-pap-1990-2025.zip
  # bonus : ADEME, API Base Carbone
  base_carbone: https://data.ademe.fr/data-fair/api/v1/datasets/base-carboner/lines

# SNCF : API Opendatasoft
sncf:
  api: https://ressources.data.sncf.com/api/explore/v2.1/catalog/datasets
  frequentation: frequentation-gares-archive   # 2015-2024 (le jeu 2025 n'est pas comparable)
  gares: gares-de-voyageurs

# bonus : facteurs d'émission de la Base Carbone (identifiant ADEME : mode)
facteurs_ademe:
  "43743": avion        # 101-220 sièges, 500-1000 km, avec traînées
  "43256": tgv
  "43272": intercites
  "43255": ter
  "43791": voiture      # par véhicule.km

# seuils
actifs_min: 1000          # part voiture à NaN en dessous
seuil_stable_pct: 0.2     # trajectoire stable entre -0,2 et +0,2 % par an
seuil_desservie_km: 10    # commune desservie : gare à 10 km ou moins

# codes INSEE, à relever dans la table de passage
codes_insee:
  naissances: A_VERIFIER
  deces: A_VERIFIER
  modes_transport: A_VERIFIER

aeroports_villes:
  LFPG: {ville: Paris, code_commune: "75056"}
  LFPO: {ville: Paris, code_commune: "75056"}
  LFML: {ville: Marseille, code_commune: "13055"}
