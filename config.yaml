# Paramètres communs du projet, lus par chaque notebook.
# Rangés dans l'ordre du projet : 01_donnees, 02_base_finale, puis le bonus.


# ========== Période et géographie ==========

# période de comparaison (recensement 2023)
annee_debut: 2017
annee_fin: 2023

# millésime des contours des communes (cartiflette)
annee_geographie: 2026

# projection pour les calculs de distance (Lambert 93, en mètres)
crs_calcul: 2154

# communes hors métropole, retirées des tables INSEE (codes commençant par 97 ou 98)
geographie:
  prefixes_hors_metropole: ['97', '98']


# ========== Dossiers ==========

dossiers:
  brut: data/raw        # fichiers téléchargés, jamais modifiés (utilisé par les fonctions INSEE)
  propre: data/clean    # non utilisé : les chemins de data/clean/ sont dans les notebooks et src/config.py


# ========== 01_donnees : les sources ==========

# 1.2 et 1.3 : INSEE, recensement 2023 (population, navettes domicile-travail)
insee:
  tolerance_additivite: 0.001   # écart toléré entre la somme des modes et le total INSEE
  population:
    url: https://www.insee.fr/fr/statistiques/fichier/9003931/DS_RP_SERIE_HISTORIQUE_2023_CSV_FR.zip
    fichier: DS_RP_SERIE_HISTORIQUE_2023_CSV_FR.zip
    filtres: {GEO_OBJECT: COM, FREQ: A, OCS: _T}
    mesures: {population: POP, superficie: SUP, naissances: BRTH, deces: DEATH}
  navettes:
    url: https://www.insee.fr/fr/statistiques/fichier/8992172/DS_RP_NAVETTES_PRINC_2023_CSV_FR.zip
    fichier: DS_RP_NAVETTES_PRINC_2023_CSV_FR.zip
    filtres: {GEO_OBJECT: COM, FREQ: A, AGE: Y_GE15, EMPSTA_ENQ: '1', WORK_AREA: _T, RP_MEASURE: POP}
    modes:
      total: ['_T']
      sans_deplacement: ['1']
      marche: ['2']
      deux_roues: ['3', '4']
      voiture: ['5']
      transports_commun: ['6']

# 1.4 : SNCF, API Opendatasoft
# non utilisé : les adresses sont écrites dans get_gares et get_frequentation (src/collecte.py)
sncf:
  api: https://ressources.data.sncf.com/api/explore/v2.1/catalog/datasets
  frequentation: frequentation-gares-archive   # 2015-2024 (le jeu 2025 n'est pas comparable)
  gares: gares-de-voyageurs

# adresses des autres sources
urls:
  # 1.5 : SDES, parc de véhicules routiers au niveau communal (API DiDo)
  parc_auto: https://data.statistiques.developpement-durable.gouv.fr/dido/api/v1/datafiles/1582861b-e042-4490-9161-6429d8229703/csv
  # 1.6 (bonus) : DGAC, trafic aérien par paire d'aéroports (série PAP)
  dgac_pap: https://static.data.gouv.fr/resources/trafic-aerien-commercial-mensuel-francais-par-paire-daeroports-par-sens-depuis-1990/20260903-120658/asp-pap-1990-2025.zip
  # 1.7 (bonus) : ADEME, API Base Carbone
  base_carbone: https://data.ademe.fr/data-fair/api/v1/datasets/base-carboner/lines

# 1.7 (bonus) : facteurs d'émission de la Base Carbone (identifiant ADEME : mode)
facteurs_ademe:
  "43743": avion        # 101-220 sièges, 500-1000 km, avec traînées
  "43256": tgv
  "43272": intercites
  "43255": ter
  "43791": voiture      # par véhicule.km


# ========== 02_base_finale : les variables ==========

# classes de taille des communes (habitants en 2023)
bornes_taille: [0, 500, 2000, 5000, 10000, 50000]
noms_taille: ["moins de 500", "500 à 2 000", "2 000 à 5 000", "5 000 à 10 000", "10 000 à 50 000", "50 000 et plus"]

# seuils
actifs_min: 1000          # part voiture à NaN en dessous
seuil_stable_pct: 0.2     # trajectoire stable entre -0,2 et +0,2 % par an
seuil_desservie_km: 10    # commune desservie : gare à 10 km ou moins


# ========== 04_bonus_train_avion : position des aéroports ==========

